/* layout: 素白菜单式页面；制作台上方吸顶一只杯子，下方可收起的原料抽屉；底部两个标签切换制作和图鉴；喝的时候整屏只有这一杯 */
:root{
  --bg:#f7f6f3; --paper:#ffffff; --ink:#262625; --ink2:#6e6d69; --ink3:#aaa9a4; --line:#e6e4df; --tint:#f0efeb; --glass:rgba(255,255,255,.75);
  --f:"SGH","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141413;--paper:#1c1c1b;--ink:#ecebe6;--ink2:#a3a29c;--ink3:#6a6964;--line:#2d2d2b;--tint:#252523;--glass:rgba(255,255,255,.05);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--paper:#1c1c1b;--ink:#ecebe6;--ink2:#a3a29c;--ink3:#6a6964;--line:#2d2d2b;--tint:#252523;--glass:rgba(255,255,255,.05);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);min-height:100%}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.7;letter-spacing:.03em;padding-inline:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
button:focus-visible,summary:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.app{max-width:960px;margin:0 auto;padding-block:14px calc(76px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.brand{font-size:21px;letter-spacing:.16em;line-height:1.2}
.since{font-size:10.5px;color:var(--ink3);letter-spacing:.28em;margin-top:4px}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sbtns{display:flex;gap:6px}
.ib{display:inline-flex;align-items:center;gap:4px;height:30px;min-width:30px;justify-content:center;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:0 8px;color:var(--ink2);font-size:11px;letter-spacing:.1em}
.ib svg{width:17px;height:17px}
.listen{min-height:calc(100vh - 60px);min-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding-block:24px}
.lclock{font-size:58px;line-height:1.1;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.ldate{font-size:12px;color:var(--ink3);letter-spacing:.26em}
.listen .cupbox{height:300px;margin:22px 0 12px;display:flex;align-items:flex-end;justify-content:center}
.listen .cupbox svg{animation:float 6s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-7px)}}
.lnow{font-size:11px;color:var(--ink3);letter-spacing:.32em}
.lsong{display:flex;align-items:center;gap:18px;font-size:19px;letter-spacing:.22em}
.lsong .ib{border:0;background:none}
.lacts{display:flex;gap:10px;margin-top:26px;align-items:center}
.ltimer{font-size:11px;color:var(--ink3);letter-spacing:.2em;margin-top:12px;min-height:16px}
.listen{transition:opacity 8s ease}.listen.asleep{opacity:.25}
@media (prefers-reduced-motion:reduce){.listen .cupbox svg{animation:none}}.ib .ln{stroke:var(--ink2);stroke-width:1.5}
.ib[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}.ib[aria-pressed="true"] .ln{stroke:var(--ink)}
.no{font-size:12px;color:var(--ink2);letter-spacing:.14em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.lf{stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
.gl{fill:var(--glass)}
.stw{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
/* make */
.make{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:14px 14px;border-bottom:1px solid var(--line);text-align:center}
.stage .cupbox{height:190px;display:flex;justify-content:center;align-items:flex-end}
.mname{font-size:19px;margin-top:6px;line-height:1.35;text-wrap:balance;min-height:26px}
.mmeta{font-size:11.5px;color:var(--ink3);letter-spacing:.2em;margin-top:2px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 20px;font-size:14px;letter-spacing:.12em}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.panel{display:flex;flex-direction:column}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 2px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .sl{font-size:15px;letter-spacing:.14em;flex:none}
summary .sv{font-size:12.5px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;flex:1}
summary::after{content:"+";color:var(--ink3);font-size:16px;width:12px;text-align:center;flex:none}
details[open] summary::after{content:"−"}
.body{padding:0 0 18px}
.gh{font-size:11px;color:var(--ink3);letter-spacing:.24em;margin:4px 0 8px}
.gh~.gh{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.q{border:1px solid var(--line);background:var(--paper);border-radius:999px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 14px}
.chip[aria-pressed="true"],.q.on{border-color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink)}
.q{display:inline-flex;align-items:stretch}
.q button{border:0;background:none;display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 14px}
.q .mi{padding:6px 12px;border-left:1px solid var(--line);color:var(--ink2)}
.dots{display:inline-flex;gap:3px;margin-left:2px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
@media (min-width:780px){
  .make{grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:40px;align-items:start}
  .stage{top:calc(env(safe-area-inset-top,0px) + 12px);border:0;padding-top:28px}
  .stage .cupbox{height:260px}
}
/* drink */
.drink{max-width:420px;margin:0 auto;text-align:center;padding-top:18px}
.ticket{display:flex;justify-content:space-between;font-size:11.5px;font-variant-numeric:tabular-nums}
.drink .cupbox{height:320px;display:flex;justify-content:center;align-items:flex-end;margin-top:20px}
.dname{font-size:25px;letter-spacing:.1em;margin-top:14px;line-height:1.35;text-wrap:balance}
.dmeta{font-size:12px;color:var(--ink3);letter-spacing:.2em;margin-top:4px;min-height:20px}
.note{margin:20px 0 4px;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:14px 18px;text-align:left}
.note .k{font-size:11px;letter-spacing:.26em;color:var(--ink3)}
.note .d{font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.8}
.note .c,.note .w{font-size:12px;color:var(--ink3);margin-top:8px;letter-spacing:.08em}
.note .w{color:var(--ink2)}
.drink .acts{margin-top:20px}
.duobtn{margin-top:12px}
.duobtn .btn{font-size:13px;letter-spacing:.14em}
.pair{display:flex;gap:14px;justify-content:center;align-items:flex-end}
.pair figure{margin:0;display:flex;flex-direction:column;align-items:center}
.pair figcaption{font-size:11px;letter-spacing:.3em;color:var(--ink3);margin-top:6px}
.pair figure.enter{animation:slidein .7s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pair figure.enter{animation:none}}
.duonote{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.7}
.duonote q{color:var(--ink3);display:block;font-size:12.5px;quotes:'「' '」'}
.rrow.rsec{margin-top:10px}.rrow.rsec span{color:var(--ink);letter-spacing:.12em}
/* book */
.bookh{display:flex;justify-content:space-between;align-items:baseline;padding-top:22px}
.bookh h2{font-size:22px;font-weight:400;letter-spacing:.2em;margin:0}
.bc{font-size:13px;color:var(--ink2);letter-spacing:.12em;font-variant-numeric:tabular-nums}
.bar{height:1px;background:var(--line);margin:12px 0 20px}
.bar i{display:block;height:1px;background:var(--ink);transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.card{background:var(--paper);border:0;padding:18px 12px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
button.card:hover{background:var(--tint)}
.card .cc{height:100px;display:flex;align-items:flex-end}
.cn{font-size:15px;letter-spacing:.08em;margin-top:6px}
.cn.dim{color:var(--ink3)}
.cd{font-size:12px;color:var(--ink2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:10.5px;letter-spacing:.22em;color:var(--ink2);border:1px solid var(--line);padding:0 8px;margin-top:4px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;letter-spacing:.26em;color:var(--ink3)}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] .ln{stroke:var(--ink)}
.tabs .ln{stroke:var(--ink3);stroke-width:1.3}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.seg{display:flex;justify-content:center;gap:26px;margin-bottom:6px}
.seg button{border:0;background:none;padding:4px 1px;font-size:14px;letter-spacing:.22em;color:var(--ink3);border-bottom:1px solid transparent;display:inline-flex;align-items:baseline;gap:6px}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.seg small{font-size:11px;letter-spacing:.06em;color:var(--ink3);font-variant-numeric:tabular-nums}
#seg-book{justify-content:flex-start;margin:0 0 18px;gap:6px 16px;flex-wrap:wrap}
.seg button{white-space:nowrap}
#seg-book button{font-size:13.5px;letter-spacing:.14em}
.closed{padding:36px 8px 20px;text-align:center;color:var(--ink2);line-height:2;font-size:14px}
.closed .sign{display:inline-block;border:1px solid var(--ink);color:var(--ink);padding:6px 20px;letter-spacing:.34em;margin-bottom:16px;font-size:15px}
.btn:disabled{opacity:.35;cursor:default}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.bub{animation:rise 2.6s linear infinite}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(2.5px)}}
.bob{animation:bob 1.8s ease-in-out infinite alternate}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.steam{animation:steam 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bub,.bob,.steam{animation:none}}
#d-cup,#m-cup{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stir{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:10px}
.sdots{display:inline-flex;gap:6px}
.sdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.sdots i.f{background:var(--ink)}
.shint{font-size:11px;color:var(--ink3);letter-spacing:.14em;border:0;background:none;padding:2px 6px;font-family:inherit}
.shint:not(:disabled){color:var(--ink2);cursor:pointer}
.shint:disabled{cursor:default}
#m-stir{margin-top:6px;gap:3px}
.btn{padding:8px 17px}
.ticket{cursor:pointer;border:0;background:none;width:100%;font:inherit;letter-spacing:.2em;color:var(--ink3);padding:0 0 10px;border-bottom:1px dashed var(--line)}
.ticket b{font-weight:400;color:var(--ink2)}
.rcpt{margin-top:14px;background:var(--paper);border:1px solid var(--line);padding:18px 20px 16px;text-align:left}
.rrow{display:flex;justify-content:space-between;gap:16px;font-size:13.5px;padding:3px 0}
.rrow span:first-child{color:var(--ink3);letter-spacing:.14em;flex:none}
.rrow span:last-child{text-align:right;min-width:0}
.rsum{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.rbc{display:flex;justify-content:center;margin:14px 0 4px}
.rbc svg{height:44px;width:auto;max-width:100%}
.rft{text-align:center;font-size:11px;color:var(--ink3);letter-spacing:.24em}
.racts{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.racts .btn{display:inline-flex;align-items:center;gap:6px}
.heart{width:15px;height:15px}
.btn.on .heart path{fill:var(--ink)}
.fbox{margin-top:12px;display:flex;gap:8px}
.fbox input{flex:1;min-width:0;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px}
.rimg{margin-top:14px;text-align:center}
.rimg img{width:100%;max-width:320px;border:1px solid var(--line);display:block;margin:0 auto}
.rimg p{font-size:12px;color:var(--ink2);margin:8px 0 0}
.diary{background:var(--paper);border:1px solid var(--line);padding:18px 20px 16px;margin-bottom:12px}
.diary h3{font-weight:400;font-size:15px;letter-spacing:.14em;margin:0 0 8px;display:flex;justify-content:space-between;gap:12px}
.diary h3 small{font-size:12px;color:var(--ink3);letter-spacing:.1em}
.diary p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.95}
.empty{padding:40px 12px;text-align:center;color:var(--ink2);font-size:13.5px;line-height:1.9;border:1px solid var(--line);background:var(--paper)}
/* ---------- home ---------- */
.home{max-width:440px;margin:0 auto;text-align:center;padding-top:10px}
.hero{position:relative;width:100%;aspect-ratio:1080/920;cursor:pointer}
.hl{position:absolute;display:block;height:auto;pointer-events:none;user-select:none;-webkit-user-select:none}
.h-bulbwrap{position:absolute;transform-origin:41.4% 0;pointer-events:none}
.h-bulbwrap .hl-b{width:100%;display:block;position:relative;opacity:.28}
.h-glow{position:absolute;left:-2%;top:48%;width:104%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,214,120,.22) 38%,rgba(255,214,120,0) 68%);opacity:0;transform:translateY(-50%) scale(1.25)}
.hero.play .hl-b{animation:h-on 1s steps(1) .6s forwards}
.hero.play .h-glow{animation:h-glowon 1s .6s forwards,h-breathe 3.2s ease-in-out 1.8s infinite}
.hero.play .h-bulbwrap{animation:h-swing 2.6s cubic-bezier(.36,.07,.19,.97) .9s,h-sway 5s ease-in-out 3.5s infinite}
@keyframes h-on{0%{opacity:1}12%{opacity:.3}24%{opacity:1}34%{opacity:.45}46%,100%{opacity:1}}
@keyframes h-glowon{0%{opacity:0}12%{opacity:.9}24%{opacity:.2}46%,100%{opacity:1}}
@keyframes h-breathe{50%{opacity:.75}}
@keyframes h-swing{0%{transform:rotate(0)}15%{transform:rotate(9deg)}35%{transform:rotate(-6deg)}55%{transform:rotate(3.5deg)}75%{transform:rotate(-1.5deg)}100%{transform:rotate(0)}}
@keyframes h-sway{0%,100%{transform:rotate(0)}30%{transform:rotate(1.6deg)}70%{transform:rotate(-1.6deg)}}
.h-w1,.h-w2,.h-w3{clip-path:inset(0 100% 0 0)}
.hero.play .h-w1{animation:h-write .7s linear 2.2s forwards}.hero.play .h-w2{animation:h-write .6s linear 3s forwards}.hero.play .h-w3{animation:h-write .6s linear 3.7s forwards}
@keyframes h-write{to{clip-path:inset(0 0 0 0)}}
.h-cat{opacity:0}
.hero.play .h-cat{animation:h-pop .9s cubic-bezier(.3,1.5,.5,1) 4.7s forwards}
@keyframes h-pop{0%{opacity:0;transform:translateY(14%) scale(.96)}100%{opacity:1;transform:none}}
.h-text{clip-path:inset(0 0 100% 0)}
.hero.play .h-text{animation:h-down 2.2s cubic-bezier(.4,0,.3,1) 5.9s forwards}
@keyframes h-down{to{clip-path:inset(0 0 0 0)}}
.h-bird{transform-origin:50% 100%}
.hero.play .h-bird{animation:h-hop 6s ease-in-out 8.5s infinite}
@keyframes h-hop{0%,82%,100%{transform:none}86%{transform:translateY(-12%) rotate(-6deg)}90%{transform:none}94%{transform:rotate(8deg)}97%{transform:none}}
@media (prefers-reduced-motion:reduce){.hero.play *{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hl,:root:not([data-theme="light"]) .hl-b{filter:invert(.9)}}
:root[data-theme="dark"] .hl,:root[data-theme="dark"] .hl-b{filter:invert(.9)}
.h-name{display:block;margin:44px auto 0;font:inherit;font-size:25px;letter-spacing:.3em;padding:6px 4px 6px 12px;border:0;background:none;color:var(--ink);cursor:pointer}
.h-since{font-size:10.5px;letter-spacing:.34em;color:var(--ink3);margin-top:2px}
.h-story{margin:40px auto 0;padding-bottom:40px;max-width:300px;font-size:13px;line-height:2.1;color:var(--ink2);letter-spacing:.08em}
.h-story .hq{color:var(--ink)}
.brand{cursor:pointer}
.h-story i{font-style:normal}.h-story .ql{margin-right:-.55em}.h-story .qr{margin-left:-.55em}
</style>

const clone=o=>JSON.parse(JSON.stringify(o));
function norm(o){const s=Object.assign(clone(DEF),o||{});if(!CUPS[s.cup])s.cup='直身杯';if(!TEAS[s.tea])s.tea='阿萨姆';if(!(s.milk in MILK))s.milk='牛奶';if(!(s.cap in CAPS))s.cap='不要';if(!(s.ice in ICES))s.ice='少冰';if(!SUGARS.includes(s.sugar))s.sugar='五分糖';
 s.fruits=Object.fromEntries(Object.entries(s.fruits||{}).filter(([k,n])=>FR[k]&&!FR[k].veg&&n>0).map(([k,n])=>[k,Math.min(3,n)]));
 s.veg=Object.fromEntries(Object.entries(s.veg||{}).filter(([k,n])=>FR[k]&&FR[k].veg&&n>0).map(([k,n])=>[k,Math.min(3,n)]));if(!SWS.includes(s.sw))s.sw='普通糖';if(!FIZZ.includes(s.fizz))s.fizz='不加';
 s.tops=Object.fromEntries(Object.entries(s.tops||{}).filter(([k,n])=>k in TOPS&&n>0).map(([k,n])=>[k,Math.min(3,n)]));

const V=(s,v,n=1)=>((s.veg||{})[v]||0)>=n,nV=s=>Object.values(s.veg||{}).filter(x=>x>0).length;
const bare=s=>!nF(s)&&!nP(s)&&!nV(s)&&s.cap==='不要'&&!s.garn.length&&(s.fizz||'不加')==='不加';

const curSeason=()=>{const m=new Date().getMonth()+1;return m>=3&&m<=5?'春':m<=8&&m>=6?'夏':m>=9&&m<=11?'秋':'冬'};
function mkR([id,name,desc,hint,ok,season]){return{id,name,desc,hint,hidden:hint===null,season,ok:season?s=>curSeason()===season&&ok(s):ok}}

 ['gege','哥哥特调','伯爵的香像旧书页，燕麦奶温温的，桂花蜜只淋一点点，三分糖，少冰。这是哥哥的专属特调，被你找到了。写东西写累了、上班上烦了，就来这儿调一杯，慢慢喝。',null,s=>TS(s,'伯爵红茶')&&s.milk==='燕麦奶'&&G(s,'桂花蜜')&&s.sugar==='三分糖'&&s.ice==='少冰'],
 ['boom','小肉松爆炸水','百香果放满，西瓜打底，再丢一丢丢菠萝。松雨喝了很多年的招牌，一口下去酸得炸开。',null,s=>F(s,'百香果',3)&&F(s,'西瓜')&&F(s,'菠萝')],

 ['taro','芋泥波波','紫紫的芋泥糊在杯底，配软软的波波。','要奶，紫紫的一大坨，配上波波',s=>M(s)&&P(s,'芋泥')&&P(s,'珍珠')],
 ['xiancao','芋圆烧仙草','仙草冻滑滑的，芋圆一颗颗有嚼劲。','黑黑的冻，配彩色的圆子',s=>P(s,'仙草冻')&&P(s,'芋圆')],

/* ---------- names ---------- */
const SHORT={'英德红茶':'英红','伯爵红茶':'伯爵','泰式红茶':'泰式','茉莉绿茶':'茉莉','冻顶乌龙':'冻顶','老白茶':'白茶','洛神花':'洛神'};
function autoName(s){
 const fs=Object.entries({...s.fruits,...(s.veg||{})}).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
 const ts=Object.entries(s.tops).filter(e=>e[1]>0&&!(e[0]==='草莓粒'&&s.fruits['草莓']));
 const fp=fs.length>=4?'缤纷':fs.slice(0,2).map(([f,n])=>(n>=3?'满杯':'')+f).join('');
 const tp=ts.length>=4?'全料':ts.slice(0,2).map(e=>e[0]).join('')+(ts.length>2?'多料':'');
 const cp={'奶盖':'奶盖','芝士奶盖':'芝士','奶油顶':'云顶','雪顶':'雪顶'}[s.cap]||'';
 const T=TEAS[s.tea],m=M(s);let base;
 if(!T.c)base=m?({'牛奶':'鲜奶'}[s.milk]||s.milk):(fs.length?'果饮':'白开水');
 else{const sh=SHORT[s.tea]||s.tea;if(m)base=s.tea==='抹茶'?'抹茶拿铁':(T.g==='绿茶 · 白茶'?sh+'奶绿':sh+'奶茶');else base=fs.length?sh+'果茶':s.tea}
 return (s.ice==='热'?'热':'')+fp+tp+cp+({'雪碧':'雪碧','苏打水':'气泡'}[s.fizz]||'')+base+(s.ice==='冰沙'?'冰沙':'')}

 el.addEventListener('pointermove',e=>{if(last===null)return;const a=ang(e);let d=a-last;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;last=a;const v=api.get();if(v>=5)return;api.set(Math.min(5,v+Math.abs(d)/(2*Math.PI)));acc+=Math.abs(d);if(acc>Math.PI*.8){acc=0;SND.fx('stir')}if(!raf)raf=requestAnimationFrame(()=>{raf=0;api.draw()})});
